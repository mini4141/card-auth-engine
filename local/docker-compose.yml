name: card-auth-engine
x-app-env: &app-env
  POSTGRES_HOST: postgres
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  AWS_REGION: ap-southeast-2
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
services:
  postgres:
    image: postgres:17.6
    environment: { POSTGRES_DB: cardauth, POSTGRES_USER: cardauth, POSTGRES_PASSWORD: cardauth }
    command: ["postgres", "-c", "max_connections=200"]
    ports: ["15432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cardauth -d cardauth"], interval: 3s, retries: 20 }
  redis:
    image: redis:7.4.2
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30
  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports: ["8000:8000"]
  auth-service:
    build: { context: .., dockerfile: services/Dockerfile, args: { JAR: services/auth-service/build/libs/auth-service-0.1.0.jar } }
    environment:
      <<: *app-env
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-true}
      DEFAULT_STRATEGY: ${DEFAULT_STRATEGY:-redis-lua}
      NAIVE_LOG_LEVEL: ${NAIVE_LOG_LEVEL:-INFO}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      dynamodb: { condition: service_started }
    restart: on-failure
  settlement-service:
    build: { context: .., dockerfile: services/Dockerfile, args: { JAR: services/settlement-service/build/libs/settlement-service-0.1.0.jar } }
    environment: *app-env
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: on-failure
  notification-service:
    build: { context: .., dockerfile: services/Dockerfile, args: { JAR: services/notification-service/build/libs/notification-service-0.1.0.jar } }
    environment:
      <<: *app-env
      BENCHMARKS_FILE: /docs/benchmarks.json
    volumes: ["../docs:/docs:ro"]
    ports: ["8082:8082"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure
  nginx:
    image: nginx:1.27.3
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [auth-service, notification-service]
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [auth-service]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
