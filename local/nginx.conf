events { worker_connections 8192; }
http {
  upstream auth { server auth-service:8080; keepalive 512; }   # both scaled instances, round-robin
  upstream notification { server notification-service:8082; }
  access_log off;
  server {
    listen 80 backlog=4096;
    location /stream      { proxy_pass http://notification; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_read_timeout 1h; }
    location /dashboard   { proxy_pass http://notification; }
    location /benchmarks  { proxy_pass http://notification; }
    location /            { proxy_pass http://auth; proxy_http_version 1.1; proxy_set_header Connection ""; }
  }
}
