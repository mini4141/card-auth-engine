server:
  port: 8082
  shutdown: graceful

spring:
  application.name: notification-service
  threads.virtual.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  benchmarks-file: ${BENCHMARKS_FILE:}

management:
  endpoints.web.exposure.include: health,prometheus,info
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: 1.0
  metrics.tags.application: notification-service

logging:
  structured.format.console: logstash
