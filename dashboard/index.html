<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Auth Engine</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --bad:#ef4444; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
  h1 { font-size:18px; margin:0; } h2 { font-size:14px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .grid { display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; padding:16px 20px; }
  .panel { background:var(--panel); border-radius:10px; padding:14px; min-width:0; }
  .full { grid-column: 1 / -1; }
  .stats { display:flex; gap:24px; } .stat b { font-size:22px; display:block; } .stat span { color:var(--muted); font-size:12px; }
  #ticker { height:360px; overflow:hidden; font-family: ui-monospace, Consolas, monospace; font-size:12px; }
  #ticker div { padding:2px 0; border-bottom:1px solid #2b3a52; white-space:nowrap; }
  .APPROVED { color:var(--ok); } .DECLINED { color:var(--bad); } .settled { color:var(--accent); }
  table { width:100%; border-collapse:collapse; } th, td { text-align:right; padding:6px 8px; border-bottom:1px solid #334155; }
  th:first-child, td:first-child { text-align:left; } th { color:var(--muted); font-weight:600; }
  .over { color:var(--bad); font-weight:700; }
  .live { color:var(--ok); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Card Auth Engine <small style="color:var(--muted)">live authorisations</small></h1>
  <div class="stats">
    <div class="stat"><b id="n-approved">0</b><span>approved</span></div>
    <div class="stat"><b id="n-declined">0</b><span>declined</span></div>
    <div class="stat"><b id="n-settled">0</b><span>settled</span></div>
    <div class="stat"><b id="rate">0</b><span>auth/s</span></div>
    <div class="live" id="conn">connecting…</div>
  </div>
</header>
<div class="grid">
  <div class="panel"><h2>Live authorisation stream (SSE)</h2><div id="ticker"></div></div>
  <div class="panel"><h2>Card limit gauges (available vs used)</h2><canvas id="gauges" height="300"></canvas></div>
  <div class="panel full"><h2>Strategy benchmark</h2>
    <table id="bench"><thead><tr><th>strategy</th><th>approved</th><th>overspend ¥</th><th>p50 ms</th><th>p95 ms</th><th>p99 ms</th><th>req/s</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script src="vendor/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const counts = { approved:0, declined:0, settled:0 };
let window1s = 0;
const ticker = $('ticker');

function line(cls, text) {
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  ticker.prepend(d);
  while (ticker.children.length > 22) ticker.lastChild.remove();
}

const es = new EventSource('/stream');
es.onopen = () => { $('conn').textContent = '● live'; };
es.onerror = () => { $('conn').textContent = 'reconnecting…'; };
es.addEventListener('auth', ev => {
  const e = JSON.parse(ev.data);
  window1s++;
  if (e.decision === 'APPROVED') counts.approved++; else counts.declined++;
  line(e.decision, `${e.decision.padEnd(8)} ¥${String(e.amount).padStart(7)}  ${e.strategy.padEnd(14)} card ${e.cardId.slice(0,8)}  left ¥${e.availableAfter}  ${e.reason}`);
  $('n-approved').textContent = counts.approved; $('n-declined').textContent = counts.declined;
});
es.addEventListener('settlement', ev => {
  const e = JSON.parse(ev.data); counts.settled++;
  line('settled', `SETTLED  ¥${String(e.amount).padStart(7)}  ledger posted  card ${e.cardId.slice(0,8)}  auth ${e.authId.slice(0,8)}`);
  $('n-settled').textContent = counts.settled;
});
setInterval(() => { $('rate').textContent = window1s; window1s = 0; }, 1000);

const chart = new Chart($('gauges'), {
  type: 'bar',
  data: { labels: [], datasets: [
    { label: 'used', data: [], backgroundColor: '#ef4444' },
    { label: 'available', data: [], backgroundColor: '#22c55e' } ] },
  options: { indexAxis: 'y', animation: false,
    scales: { x: { stacked: true, ticks: { color: '#94a3b8' } }, y: { stacked: true, ticks: { color: '#e2e8f0' } } },
    plugins: { legend: { labels: { color: '#e2e8f0' } } } }
});
async function refreshCards() {
  try {
    const cards = (await (await fetch('/cards')).json()).slice(-8);
    chart.data.labels = cards.map(c => `${c.holder} (${c.id.slice(0,6)}) ¥${c.limit.toLocaleString()}`);
    chart.data.datasets[0].data = cards.map(c => Math.max(0, c.limit - c.available));
    chart.data.datasets[1].data = cards.map(c => Math.max(0, c.available));
    chart.update();
  } catch (e) {}
}
setInterval(refreshCards, 1000); refreshCards();

async function loadBench() {
  try {
    const rows = (await (await fetch('/benchmarks')).json()).filter(r => (r.mode || 'burst') === 'burst');
    const tb = document.querySelector('#bench tbody'); tb.innerHTML = '';
    for (const r of rows) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.strategy}</td><td>${r.approved_count}</td><td class="${r.overspend_amount > 0 ? 'over' : ''}">${r.overspend_amount}</td>
        <td>${r.p50_ms}</td><td>${r.p95_ms}</td><td>${r.p99_ms}</td><td>${r.throughput_rps}</td>`;
      tb.appendChild(tr);
    }
  } catch (e) {}
}
loadBench(); setInterval(loadBench, 15000);
</script>
</body>
</html>
